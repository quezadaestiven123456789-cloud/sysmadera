# ===== MySQL Database - PROD =====
spring.datasource.url=jdbc:mysql://localhost:3306/woodmanager?useSSL=true&serverTimezone=America/Mexico_City
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===== JPA / Hibernate =====
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===== JWT =====
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

# ===== CORS =====
app.cors.allowed-origins=https://woodmanager.com

# ===== Bootstrap Admin =====
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD}
app.admin.email=${ADMIN_EMAIL:admin@madera.com}

# ===== Rate Limiting (Brute Force Protection) =====
app.rate-limit.max-requests=${RATE_LIMIT_MAX:5}
app.rate-limit.window-minutes=${RATE_LIMIT_WINDOW:1}

# ===== Logging =====
logging.level.com.madera.sys_madera=WARN
logging.level.org.springframework.security=WARN
