<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WoodManager - Iniciar Sesión</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="/css/woodmanager.css">
  <style>
    .password-toggle {
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 16px;
      z-index: 5;
    }
    .password-toggle:hover { color: var(--text-secondary); }
  </style>
</head>
<body class="login-page">
  <div class="login-container">
    <div class="login-card">
      <div class="login-logo">
        <div class="brand-icon">
          <i class="fas fa-tree"></i>
        </div>
        <h1>WoodManager</h1>
        <p>Sistema de Gestión de Carpintería</p>
      </div>

      <div id="loginError" class="alert alert-danger d-none" style="background: rgba(255,77,79,0.1); border: 1px solid rgba(255,77,79,0.2); color: var(--danger); font-size: 13px; border-radius: var(--radius-md);"></div>

      <form id="loginForm" onsubmit="return handleLogin(event)">
        <div class="mb-4">
          <div class="form-floating">
            <input type="text" class="form-control" id="username" placeholder="usuario" required autocomplete="username">
            <label for="username"><i class="fas fa-user me-2"></i>Usuario</label>
          </div>
        </div>

        <div class="mb-4" style="position: relative;">
          <div class="form-floating">
            <input type="password" class="form-control" id="password" placeholder="Contraseña" required autocomplete="current-password">
            <label for="password"><i class="fas fa-lock me-2"></i>Contraseña</label>
          </div>
          <button type="button" class="password-toggle" onclick="togglePassword()" tabindex="-1">
            <i class="far fa-eye" id="toggleIcon"></i>
          </button>
        </div>

        <button type="submit" class="btn btn-gold mb-3" id="loginBtn">
          <i class="fas fa-arrow-right-to-bracket me-2"></i><span>Iniciar Sesión</span>
        </button>

        <div class="text-center">
          <p style="color: var(--text-secondary); font-size: 12px; margin: 0;">
            ¿No tienes cuenta? <a href="register.html">Crear cuenta</a>
          </p>
        </div>
      </form>
    </div>

    <div class="text-center mt-3">
      <p style="color: var(--text-muted); font-size: 11px;">
        &copy; 2026 WoodManager. Todos los derechos reservados.
      </p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script>
    function togglePassword() {
      var pwd = document.getElementById('password');
      var icon = document.getElementById('toggleIcon');
      if (pwd.type === 'password') {
        pwd.type = 'text';
        icon.className = 'far fa-eye-slash';
      } else {
        pwd.type = 'password';
        icon.className = 'far fa-eye';
      }
    }

    function showError(msg) {
      var el = document.getElementById('loginError');
      el.textContent = msg;
      el.classList.remove('d-none');
    }

    async function handleLogin(e) {
      e.preventDefault();
      var username = document.getElementById('username').value.trim();
      var password = document.getElementById('password').value;
      var btn = document.getElementById('loginBtn');

      document.getElementById('loginError').classList.add('d-none');

      if (!username || !password) {
        showError('Por favor completa todos los campos.');
        return false;
      }

      btn.disabled = true;
      btn.querySelector('span').textContent = 'Iniciando...';

      try {
        await api.login(username, password);
        window.location.href = 'dashboard.html';
      } catch (err) {
        showError(err.message || 'Credenciales inválidas. Intenta de nuevo.');
        btn.disabled = false;
        btn.querySelector('span').textContent = 'Iniciar Sesión';
      }
      return false;
    }

    if (api.isAuthenticated()) {
      window.location.href = 'dashboard.html';
    }
  </script>
</body>
</html>
