<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WoodManager - Iniciar Sesión</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="/css/woodmanager.css">
  <style>
    .password-toggle {
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 16px;
      z-index: 5;
    }
    .password-toggle:hover { color: var(--text-secondary); }
  </style>
</head>
<body class="login-page">
  <div class="login-container">
    <div class="login-card">
      <div class="login-logo">
        <div class="brand-icon">
          <i class="fas fa-tree"></i>
        </div>
        <h1>WoodManager</h1>
        <p>Sistema de Gestión de Carpintería</p>
      </div>

      <form id="loginForm" onsubmit="return handleLogin(event)">
        <div class="mb-4">
          <div class="form-floating">
            <input type="email" class="form-control" id="email" placeholder="correo@ejemplo.com" required>
            <label for="email"><i class="far fa-envelope me-2"></i>Correo electrónico</label>
          </div>
        </div>

        <div class="mb-4" style="position: relative;">
          <div class="form-floating">
            <input type="password" class="form-control" id="password" placeholder="Contraseña" required>
            <label for="password"><i class="fas fa-lock me-2"></i>Contraseña</label>
          </div>
          <button type="button" class="password-toggle" onclick="togglePassword()" tabindex="-1">
            <i class="far fa-eye" id="toggleIcon"></i>
          </button>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-4">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="remember" style="background: var(--bg-elevated); border-color: var(--border-color);">
            <label class="form-check-label" for="remember" style="color: var(--text-secondary); font-size: 13px;">
              Recordar sesión
            </label>
          </div>
          <a href="#" style="font-size: 13px;">¿Olvidaste tu contraseña?</a>
        </div>

        <button type="submit" class="btn btn-gold mb-3">
          <i class="fas fa-arrow-right-to-bracket me-2"></i>Iniciar Sesión
        </button>

        <div class="text-center">
          <p style="color: var(--text-secondary); font-size: 12px; margin: 0;">
            ¿No tienes cuenta? <a href="#">Contacta al administrador</a>
          </p>
        </div>
      </form>
    </div>

    <div class="text-center mt-3">
      <p style="color: var(--text-muted); font-size: 11px;">
        &copy; 2026 WoodManager. Todos los derechos reservados.
      </p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    function togglePassword() {
      var pwd = document.getElementById('password');
      var icon = document.getElementById('toggleIcon');
      if (pwd.type === 'password') {
        pwd.type = 'text';
        icon.className = 'far fa-eye-slash';
      } else {
        pwd.type = 'password';
        icon.className = 'far fa-eye';
      }
    }

    function handleLogin(e) {
      e.preventDefault();
      var email = document.getElementById('email').value;
      var password = document.getElementById('password').value;

      if (!email || !password) {
        alert('Por favor completa todos los campos.');
        return false;
      }

      if (window.location.pathname.includes('login.html')) {
        window.location.href = 'dashboard.html';
      }
      return false;
    }

    document.addEventListener('DOMContentLoaded', function () {
      var inputs = document.querySelectorAll('.form-control');
      inputs.forEach(function (input) {
        input.addEventListener('focus', function () {
          this.closest('.form-floating').querySelector('label').style.color = 'var(--gold)';
        });
        input.addEventListener('blur', function () {
          this.closest('.form-floating').querySelector('label').style.color = '';
        });
      });
    });
  </script>
</body>
</html>
