<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WoodManager - Registro</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="/css/woodmanager.css">
</head>

<body class="login-page">
  <div class="login-container">
    <div class="login-card">
      <div class="login-logo">
        <div class="brand-icon"><i class="fas fa-tree"></i></div>
        <h1>WoodManager</h1>
        <p>Crear cuenta nueva</p>
      </div>

      <div id="registerError" class="alert alert-danger d-none"
        style="background: rgba(255,77,79,0.1); border: 1px solid rgba(255,77,79,0.2); color: var(--danger); font-size: 13px; border-radius: var(--radius-md);">
      </div>
      <div id="registerSuccess" class="alert d-none"
        style="background: rgba(46,212,122,0.1); border: 1px solid rgba(46,212,122,0.2); color: var(--success); font-size: 13px; border-radius: var(--radius-md);">
      </div>

      <form id="registerForm" onsubmit="return handleRegister(event)">
        <div class="row g-3 mb-3">
          <div class="col-md-6">
            <div class="form-floating">
              <input type="text" class="form-control" id="firstName" placeholder="Nombre" required>
              <label for="firstName"><i class="fas fa-user me-2"></i>Nombre</label>
            </div>
          </div>
          <div class="col-md-6">
            <div class="form-floating">
              <input type="text" class="form-control" id="lastName" placeholder="Apellido" required>
              <label for="lastName"><i class="fas fa-user me-2"></i>Apellido</label>
            </div>
          </div>
          <div class="col-md-6">
            <div class="form-floating">
              <input type="text" class="form-control" id="regUsername" placeholder="usuario" required>
              <label for="regUsername"><i class="fas fa-at me-2"></i>Usuario</label>
            </div>
          </div>
          <div class="col-md-6">
            <div class="form-floating">
              <input type="email" class="form-control" id="regEmail" placeholder="correo@ejemplo.com" required>
              <label for="regEmail"><i class="far fa-envelope me-2"></i>Email</label>
            </div>
          </div>
          <div class="col-12">
            <div class="form-floating">
              <input type="password" class="form-control" id="regPassword" placeholder="Contraseña" required
                minlength="6">
              <label for="regPassword"><i class="fas fa-lock me-2"></i>Contraseña (mín. 6 caracteres)</label>
            </div>
          </div>
        </div>

        <button type="submit" class="btn btn-gold mb-3" id="registerBtn">
          <i class="fas fa-user-plus me-2"></i><span>Crear Cuenta</span>
        </button>

        <div class="text-center">
          <p style="color: var(--text-secondary); font-size: 12px; margin: 0;">
            ¿Ya tienes cuenta? <a href="login.html">Iniciar sesión</a>
          </p>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script>
    function showMsg(elId, msg) {
      var el = document.getElementById(elId);
      el.textContent = msg;
      el.classList.remove('d-none');
    }

    async function handleRegister(e) {
      e.preventDefault();
      document.getElementById('registerError').classList.add('d-none');
      document.getElementById('registerSuccess').classList.add('d-none');

      var firstName = document.getElementById('firstName').value.trim();
      var lastName = document.getElementById('lastName').value.trim();
      var username = document.getElementById('regUsername').value.trim();
      var email = document.getElementById('regEmail').value.trim();
      var password = document.getElementById('regPassword').value;
      var btn = document.getElementById('registerBtn');

      if (!firstName || !lastName || !username || !email || !password) {
        showMsg('registerError', 'Completa todos los campos.');
        return false;
      }
      if (password.length < 6) {
        showMsg('registerError', 'La contraseña debe tener al menos 6 caracteres.');
        return false;
      }

      btn.disabled = true;
      btn.querySelector('span').textContent = 'Registrando...';

      try {
        await api.register({ firstName, lastName, username, email, password, roles: ['ADMIN'] });
        showMsg('registerSuccess', 'Cuenta creada exitosamente. Redirigiendo al login...');
        document.getElementById('registerForm').reset();
        setTimeout(function () { window.location.href = 'login.html'; }, 2000);
      } catch (err) {
        showMsg('registerError', err.message || 'Error al registrar. Intenta de nuevo.');
        btn.disabled = false;
        btn.querySelector('span').textContent = 'Crear Cuenta';
      }
      return false;
    }

    if (api.isAuthenticated()) {
      window.location.href = 'dashboard.html';
    }
  </script>
</body>

</html>
